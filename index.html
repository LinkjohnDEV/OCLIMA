<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport Responsivo & Safe-Area para Notch/Barra Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Cores de Tema do Sistema -->
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)" />

    <meta name="description" content="OCLIMA - Previsão do tempo inteligente em tempo real, radar meteorológico, gráficos hora a hora e previsão para 5 dias." />
    <title>OCLIMA | Previsão do Tempo em Tempo Real</title>

    <!-- Open Graph / WhatsApp / Facebook / Redes Sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clima.linkjohn.com/" />
    <meta property="og:title" content="OCLIMA | Previsão do Tempo em Tempo Real" />
    <meta property="og:description" content="Previsão meteorológica inteligente e de alta precisão via satélite. Gráficos de 24h, radar e fotos ao vivo para qualquer cidade do mundo." />
    <meta property="og:image" content="https://clima.linkjohn.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://clima.linkjohn.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="OCLIMA - Previsão do Tempo em Tempo Real" />
    <meta property="og:site_name" content="OCLIMA" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://clima.linkjohn.com/" />
    <meta name="twitter:title" content="OCLIMA | Previsão do Tempo em Tempo Real" />
    <meta name="twitter:description" content="Previsão meteorológica inteligente e de alta precisão via satélite." />
    <meta name="twitter:image" content="https://clima.linkjohn.com/og-image.png" />

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon & Ícones PWA -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />

    <!-- Configurações PWA Mobile (iOS / Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OCLIMA" />

    <!-- Configurações PWA Mobile (Android / Chrome) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="OCLIMA" />
    <meta name="format-detection" content="telephone=no" />
